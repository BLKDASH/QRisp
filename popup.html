<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRisp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="assets/logo.svg" width="42" height="42" alt="">
      <div>
        <h1>QRisp</h1>
        <p>离线二维码生成器</p>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="内容来源">
      <button id="page-tab" type="button" role="tab" aria-selected="true" aria-controls="page-panel">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="M3 10h18"/>
        </svg>
        当前页面
      </button>
      <button id="custom-tab" type="button" role="tab" aria-selected="false" aria-controls="custom-panel" tabindex="-1">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m14 5 5 5M4 20l1-5L16 4a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L9 19l-5 1Z"/>
        </svg>
        自定义内容
      </button>
    </div>

    <section id="preview" class="preview empty" aria-label="二维码预览">
      <canvas id="qr" role="img" aria-label="当前页面二维码" hidden></canvas>
      <div id="empty">
        <span class="empty-icon" aria-hidden="true">
          <svg class="icon" width="26" height="26" viewBox="0 0 24 24">
            <rect x="3" y="3" width="6" height="6" rx="1"/>
            <rect x="15" y="3" width="6" height="6" rx="1"/>
            <rect x="3" y="15" width="6" height="6" rx="1"/>
            <path d="M15 15h2v2h4m-6 4h2m4-1v1"/>
          </svg>
        </span>
        <span id="empty-title">二维码预览</span>
      </div>
    </section>

    <section id="page-panel" role="tabpanel" aria-labelledby="page-tab">
      <span class="page-icon" aria-hidden="true">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24">
          <path d="m10 13 4-4m-5 6-2 2a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0m2 1 2-2a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0" transform="translate(1 0)"/>
        </svg>
      </span>
      <div class="page-details">
        <h2 id="page-title">正在读取页面…</h2>
        <p id="page-url"></p>
      </div>
    </section>

    <section id="custom-panel" role="tabpanel" aria-labelledby="custom-tab" hidden>
      <div class="input-field">
        <label class="sr-only" for="content">输入网址或文字</label>
        <textarea id="content" placeholder="输入网址或文字…" spellcheck="false" aria-describedby="status"></textarea>
      </div>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="actions" class="actions">
      <div id="download-group" class="download-group">
        <button id="download" class="primary" type="button" aria-label="下载二维码（PNG）" disabled>
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/>
          </svg>
          下载二维码
        </button>
        <button id="download-format" class="primary" type="button" aria-label="选择下载格式" aria-expanded="false" aria-controls="download-formats" disabled>
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </button>
        <div id="download-formats" class="download-formats" role="group" aria-label="下载格式" hidden>
          <button type="button" value="png">PNG <span>默认</span></button>
          <button type="button" value="jpg">JPG</button>
          <button type="button" value="svg">SVG <span>矢量</span></button>
        </div>
      </div>
      <button id="copy" class="secondary" type="button" disabled>
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"/>
          <path d="M15 6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2"/>
        </svg>
        <span id="copy-label">复制链接</span>
      </button>
    </div>
  </main>
  <script src="vendor/qr.js"></script>
  <script src="popup.js"></script>
</body>
</html>
